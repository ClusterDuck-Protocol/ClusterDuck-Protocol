;; This file is used to define the common configuration for all the CDP boards

[cdp_common]
  monitor_speed = 115200 
  monitor_filters = time
  lib_deps =
    ; common libraries to all the boards
    WIRE
    SPI
    ; adafruit/Adafruit BusIO@^1.14.1
    ; adafruit/Adafruit GFX Library@^1.11.5
    ; adafruit/Adafruit SSD1306 @ ^2.5.7
    

  ; PlatformIO's Library Dependency Finder auto-discovers a registry match for
  ; the bare `#include <pb.h>` in src/payloads/generated/duck_payloads.pb.h
  ; and silently installs its own copy of the "Nanopb" library alongside our
  ; vendored runtime in src/payloads/nanopb (already on the include path via
  ; -I ./src/payloads/nanopb below). If that auto-installed copy resolves to
  ; a different nanopb release than the one our .pb.h/.pb.c files were
  ; generated with, PB_PROTO_HEADER_VERSION mismatches and the build fails
  ; with "Regenerate this file with the current version of nanopb generator."
  ; Ignore it so only our vendored copy is ever used.
  lib_ignore =
    Nanopb

  build_flags =
    -std=gnu++2a
    -Wno-inconsistent-missing-override
    -Wno-missing-field-initializers
    -Wno-format
    -I ./src
    -I ./src/include
    -I ./src/include/boards
    -I ./src/payloads/nanopb
    -DRADIOLIB_EXCLUDE_CC1101 ; exclude all the other radios to speed up the build
    -DRADIOLIB_EXCLUDE_NRF24
    -DRADIOLIB_EXCLUDE_RF69
    -DRADIOLIB_EXCLUDE_SX1231
    -DRADIOLIB_EXCLUDE_SX1233
    -DRADIOLIB_EXCLUDE_SX128X
    -DRADIOLIB_EXCLUDE_SI443X
    -DRADIOLIB_EXCLUDE_RFM2X
    -DRADIOLIB_EXCLUDE_AFSK
    -DRADIOLIB_EXCLUDE_BELL
    -DRADIOLIB_EXCLUDE_HELLSCHREIBER
    -DRADIOLIB_EXCLUDE_MORSE
    -DRADIOLIB_EXCLUDE_RTTY
    -DRADIOLIB_EXCLUDE_SSTV
    -DRADIOLIB_EXCLUDE_AX25
    -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -DRADIOLIB_EXCLUDE_PAGER
    -DRADIOLIB_EXCLUDE_FSK4
    -DRADIOLIB_EXCLUDE_APRS
    -DRADIOLIB_EXCLUDE_LLCC68
    -D CDP_INFO

  build_unflags=
    -std=gnu++11
