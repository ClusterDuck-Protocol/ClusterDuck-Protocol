  ; ;; -- HELTEC_WIFI_LORA_32_V3
  [env:test_heltec_wifi_lora_32_V3]
    extends =
      esp32_base
      cdp_common_test
    board = heltec_wifi_lora_32_V3
    lib_deps =
        ${esp32_base.lib_deps}
        FS
        WIFI

