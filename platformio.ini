;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; Some useful platformio CLI commands to build and test the code.

; to build CDP code for the heltec_wifi_lora_32_V3 board.
; platformio run -e heltec_wifi_lora_32_V3

; to build and test ALL test cases for the heltec_wifi_lora_32_V3 board and upload it.
; **Make sure the board is connected to the computer and your serial monitor is closed.**
; platformio test -e test_heltec_wifi_lora_32_V3

; to build and test a given test case for the heltec_wifi_lora_32_V3 board and upload it.
; platformio test -e test_heltec_wifi_lora_32_V3 -f test_DuckUtils
[env]
extra_scripts = pre:tools/example_select.py

[platformio]
  description = ClusterDuck Protocol Library
  lib_dir = ./src
  extra_configs = src/config/*.ini

; uncomment the line below to build for your board
   
;   ; Officially supported boards (LOCAL)
;   default_envs = local_heltec_wifi_lora_32_V2
;   default_envs = local_heltec_wifi_lora_32_V3
;   default_envs = local_lilygo_t_beam_sx1262
;   default_envs = local_lilygo_t_beam_sx1276
;   default_envs = local_ttgo_lora32_v1_3

;   ; Officially supported boards (PRODUCTION)
;   default_envs = prod_heltec_wifi_lora_32_V3
;   default_envs = prod_heltec_wifi_lora_32_V2
;   default_envs = prod_lilygo_t_beam_sx1262
;   default_envs = prod_lilygo_t_beam_sx1276
;   default_envs = prod_ttgo_lora32_v1_3

;  default_envs = test_heltec_wifi_lora_32_V3
;  default_envs = test_lilygo_t_beam_sx1262
;  default_envs = test_ttgo_lora32_v1

  [esp32_base]
    extends = cdp_common
    platform = espressif32
    board = esp32dev
    framework = arduino
    build_flags = ${cdp_common.build_flags}

  [arduino_base]
  extends = cdp_common
  framework = arduino
  lib_deps =
    	  ${env.lib_deps}
	  # renovate: datasource=github-tags depName=NonBlockingRTTTL packageName=end2endzone/NonBlockingRTTTL
	  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  build_unflags =
  	  -std=c++11
	  -std=gnu++11
  build_flags = ${env.build_flags} -Os
	  -std=gnu++17
  build_src_filter = ${env.build_src_filter} -<platform/> +<platform/extra_variants/> -<graphics/niche/>

  [nrf52_base]
  ; Instead of the standard nordicnrf52 platform, we use our fork which has our added variant files
  platform =
    # renovate: datasource=custom.pio depName=platformio/nordicnrf52 packageName=platformio/platform/nordicnrf52
    platformio/nordicnrf52@10.12.0
  extends = arduino_base
  platform_packages =
    ; our custom Git version with C++17 support in platform.txt
    # renovate: datasource=git-refs depName=meshtastic/Adafruit_nRF52_Arduino packageName=https://github.com/meshtastic/Adafruit_nRF52_Arduino gitBranch=master
    platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino#0fd295f13203e93df19d578073646ec32f2bf45a
    ; Don't renovate toolchain-gccarmnoneeabi
    platformio/toolchain-gccarmnoneeabi@~1.90301.0

  build_type = release
  build_flags =
    ${cdp_common.build_flags}
    -Wno-unused-variable
    -Isrc/platform/nrf52
    ; The Arduino loop task runs the entire cooperative OSThread scheduler; the core's stock
    ; 4 KB (1024-word) stack overflows during BLE first-sync (admin config-apply -> radio
    ; reconfigure with XEdDSA/satmap/log frames stacked) - SWD-proven on T1000-E: SP driven
    ; 40 B below pxStack, corrupting adjacent heap -> silent HardFault reset on phone pairing.
    ; 2048 words = 8 KB, validated on hardware. Value is in WORDS; requires the #ifndef guard
    ; from meshtastic/Adafruit_nRF52_Arduino#7 (harmless redefinition warning until it merges).
    -DLOOP_STACK_SZ=2048
    -Os
    -std=gnu++17
    -flto                 ; whole-image LTO (~-60KB) on every nrf52840 target; nrf52_lto.py (pre: extra_script) keeps the interrupt handlers out of LTO so they survive
    -fmerge-all-constants ; fold identical constants image-wide (~0.7KB; same flag stm32 uses)
  build_unflags =
    -Ofast
    -Og
    -ggdb3
    -ggdb2
    -g3
    -g2
    -g
    -g1
    -g0
    -std=c++11
    -std=gnu++11

  build_src_filter = 
    ${arduino_base.build_src_filter} +<platform/nrf52/> -<nimble/> -<mesh/wifi/> -<mesh/api/> -<mesh/http/> -<modules/esp32> -<mesh/eth/> -<mesh/raspihttp> -<serialization/>

  lib_deps=
    ${arduino_base.lib_deps}
;    ${radiolib_base.lib_deps}
    # renovate: datasource=git-refs depName=meshtastic/Crypto packageName=https://github.com/meshtastic/Crypto gitBranch=main
    https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip

  lib_ignore =
    BluetoothOTA
    lvgl

  [nrf52840_base]
  extends = nrf52_base

  ; Cap the app image at 0xEA000 (below the WarmNodeStore raw-flash region).
  ; Boards that have upgraded to S140 v7 override this in their own platformio.ini.
  board_build.ldscript = src/platform/nrf52/nrf52840_s140_v6.ld

  build_flags =
     ${nrf52_base.build_flags}
    -DSERIAL_BUFFER_SIZE=4096
    -DLED_BUILTIN=-1

  lib_deps =
    ${nrf52_base.lib_deps}
;    ${environmental_base.lib_deps}
;    ${environmental_extra.lib_deps}
    # renovate: datasource=git-refs depName=Kongduino-Adafruit_nRFCrypto packageName=https://github.com/Kongduino/Adafruit_nRFCrypto gitBranch=master
    https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip

  ; Common NRF52 debugging settings follow.  See the Meshtastic developer docs for how to connect SWD debugging probes to your board.

  ; We want the initial breakpoint at setup() instead of main().  Also we want to enable semihosting at that point so instead of
  debug_init_break = tbreak setup
  ; we just turn off the platformio tbreak and do it in .gdbinit (where we have more flexibility for scripting)
  ; also we use a permanent breakpoint so it gets reused each time we restart the debugging session?
  ; debug_init_break = tbreak main

  ; Note: add "monitor arm semihosting_redirect tcp 4444 all" if you want the stdout from the device to go to that port number instead
  ; (for use by meshtastic command line)
  ;  monitor arm semihosting disable
  ;  monitor debug_level 3
  ;
  ; IMPORTANT: fileio must be disabled before using port 5555 - openocd ver 0.12 has a bug where if enabled it never properly parses the special :tt name
  ; for stdio access.
  ;   monitor arm semihosting_redirect tcp 5555 stdio

  ; Also note: it is _impossible_ to do non blocking reads on the semihost console port (an oversight when ARM specified the semihost API).
  ; So we'll neve be able to general purpose bi-directional communication with the device over semihosting.
  debug_extra_cmds =
    echo Running .gdbinit script
    ;monitor arm semihosting enable
    ;monitor arm semihosting_fileio enable
    ;monitor arm semihosting_redirect disable
    commands 1
    ; echo Breakpoint at setup() has semihosting console, connect to it with "telnet localhost 5555"
    ; set wantSemihost = 1
    set useSoftDevice = 0
    end

    ; Only reprogram the board if the code has changed
  debug_load_mode = modified
  ;debug_load_mode = manual
  ; We default to the stlink adapter because it is very cheap and works well, though others (such as jlink) are also supported.
  ;debug_tool = jlink
  debug_tool = stlink
  debug_speed = 4000
  ;debug_tool = custom
  ; debug_server =
  ;  openocd
  ;  -f
  ;  /usr/local/share/openocd/scripts/interface/stlink.cfg
  ;  -f
  ;  /usr/local/share/openocd/scripts/target/nrf52.cfg
  ; $PLATFORMIO_CORE_DIR/packages/tool-openocd/openocd/scripts/interface/cmsis-dap.cfg

  ; Allows programming and debug via the RAK NanoDAP as the default debugger tool for the RAK4631 (it is only $10!)
  ; programming time is about the same as the bootloader version.
  ; For information on this see the meshtastic developers documentation for "Development on the NRF52"
  ; We manually pass in the elf file so that pyocd can reverse engineer FreeRTOS data (running threads, etc...)
  ;debug_server =
  ;  pyocd
  ;  gdbserver
  ;  -j
  ;  ${platformio.workspace_dir}/..
  ;  -t
  ;  nrf52840
  ;  --semihosting
  ;  --elf
  ;  ${platformio.build_dir}/${this.__env__}/firmware.elf

  ; If you want to debug the semihosting support you can turn on extra logging in pyocd with
  ;   -L
  ;   pyocd.debug.semihost.trace=debug

  ; The following is not needed because it automatically tries do this
  ;debug_server_ready_pattern = -.*GDB server started on port \d+.*
  ;debug_port = localhost:3333

  [env:release_cdp]
    extends = esp32_base
    lib_deps = 
      ${cdp_common.lib_deps}
      ;https://github.com/ClusterDuck-Protocol/ClusterDuck-Protocol/archive/refs/tags/5.0.0.zip
      https://github.com/muhammadn/ClusterDuck-Protocol#feature/as923-radio
      https://github.com/ropg/heltec_esp32_lora_v3/archive/refs/tags/v0.9.2.zip
      h2zero/NimBLE-Arduino@^2.1.0 
  [env:local_cdp]
    extends = esp32_base
    lib_deps = 
      ${cdp_common.lib_deps}
      symlink://./
      
  ; -------------------------------------------------------------------------------------------------------      
  ; ---- PRODUCTION ENVIRONMENTS
  ; -------------------------------------------------------------------------------------------------------


  ; PRODUCTION HELTEC_WIFI_LORA_32_V2
  [env:prod_heltec_wifi_lora_32_V2]
    extends = env:release_cdp
    board = heltec_wifi_lora_32_V2
        
  ; PRODUCTION HELTEC_WIFI_LORA_32_V3
  [env:prod_heltec_wifi_lora_32_V3]
    extends = env:release_cdp
    board = heltec_wifi_lora_32_V3

  ; PRODUCTION HELTEC_WIFI_LORA_32_v4
  [env:prod_heltec_wifi_lora_32_V4]
    extends = env:release_cdp
    board = heltec_wifi_lora_32_V3
    build_flags =
      ${cdp_common.build_flags}
      -DARDUINO_heltec_wifi_lora_32_V4
      -DARDUINO_USB_MODE=1
      -DARDUINO_USB_CDC_ON_BOOT=1
      -DARDUINO_RUNNING_CORE=1
      -DARDUINO_EVENT_RUNNING_CORE=1
    lib_deps =
      ${env:release_cdp.lib_deps}
      mikalhart/TinyGPSPlus

  ; PRODUCTION LILYGO_T_BEAM_SX1262   
  [env:prod_lilygo_t_beam_sx1262]
    extends = env:release_cdp
    board = ttgo-t-beam

  ; PRODUCTION TTGO_LORA32_V1
  [env:prod_lilygo_t_beam_sx1276]
    extends = env:release_cdp
    board = ttgo-lora32-v1

  [env:prod_ttgo_lora32_v1_3]
    extends = env:release_cdp
    board = ttgo-lora32-v1
    build_flags =
      ${cdp_common.build_flags}
      -DTTGO_1_3

  ; -------------------------------------------------------------------------------------------------------      
  ; ---- LOCAL ENVIRONMENTS
  ; -------------------------------------------------------------------------------------------------------

  ; LOCAL HELTEC_WIFI_LORA_32_V2
  [env:local_heltec_wifi_lora_32_V2]
    extends = env:local_cdp
    board = heltec_wifi_lora_32_V2
    lib_deps =
      ${env:local_cdp.lib_deps}
      https://github.com/ropg/heltec_esp32_lora_v3/archive/refs/tags/v0.9.2.zip
      ThingPulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
      ropg/HotButton
      h2zero/NimBLE-Arduino@^2.1.0

  ; LOCAL HELTEC_WIFI_LORA_32_V3
  [env:local_heltec_wifi_lora_32_V3]
    extends = env:local_cdp
    board = heltec_wifi_lora_32_V3
    build_flags =
      ${env:local_cdp.build_flags}
      -DDUCK_LANG_EN
    lib_deps =
      ${env:local_cdp.lib_deps}
      https://github.com/ropg/heltec_esp32_lora_v3/archive/refs/tags/v0.9.2.zip
      ThingPulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
      ropg/HotButton
      h2zero/NimBLE-Arduino@^2.1.0

  ; LOCAL HELTEC_WIFI_LORA_32_v4
  [env:local_heltec_wifi_lora_32_V4]
    extends = env:local_cdp
    board = heltec_wifi_lora_32_V4
    build_flags =
      ${cdp_common.build_flags}
    lib_deps =
      ${env:local_cdp.lib_deps}
      https://github.com/ropg/heltec_esp32_lora_v3/archive/refs/tags/v0.9.2.zip
      ThingPulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
      ropg/HotButton
      h2zero/NimBLE-Arduino@^2.1.0
      mikalhart/TinyGPSPlus

  ; LOCAL LILYGO_T_BEAM_SX1262      
  [env:local_lilygo_t_beam_sx1262]
    extends = env:local_cdp  
    board = ttgo-t-beam

  ; LOCAL TTGO_LORA32_V1
  [env:local_lilygo_t_beam_sx1276]
    extends = env:local_cdp 
    board = ttgo-lora32-v1

  [env:local_ttgo_lora32_v1_3]
    extends = env:local_cdp
    board = ttgo-lora32-v1
    lib_deps =
       ${env:local_cdp.lib_deps}
    build_flags =
      ${cdp_common.build_flags}
      -DTTGO_1_3

  ; ── Seeed Wio Tracker L1 Pro (nRF52840 + SX1262) ──────────────────────────
  ; LOCAL — uses symlink://. so CDP library is picked up from this repo directly.
  [env:local_wio_tracker_l1]
    board = seeed_wio_tracker_l1
    board_build.variants_dir = boards
    board_build.ldscript = nrf52840_s140_v7.ld
    board_level = pr
    extends = nrf52840_base
    build_unflags =
      -std=gnu++11
      -std=gnu++14
      -std=gnu++2a
      -flto
      -fmerge-all-constants
    build_flags =
      ${nrf52840_base.build_flags}
      -DSEEED_WIO_TRACKER_L1
      -DLED_BUILTIN=11
      -DNRF52840_XXAA
      -DS140
      -DCFG_DEBUG
      -DSOFTDEVICE_PRESENT
      -DUSE_TINYUSB
      -DENABLE_BLE
      -DDUCK_LANG_EN
      -std=gnu++17
      -Wno-unused-variable
      -DLOOP_STACK_SZ=2048
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/SPI
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Wire
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino/src
      -I src/platform/nrf52/softdevice
      -I src/platform/nrf52/softdevice/nrf52
    upload_protocol = adafruit-nrfutil
    upload_flags =
      --package-version
      4
    extra_scripts =
      pre:tools/example_select.py
      pre:tools/add_variant_libpath.py
      post:tools/gen_uf2.py
    lib_ldf_mode = chain+
    lib_ignore =
      ESP Async WebServer
      ESPAsyncTCP
      AsyncTCP
      PubSubClient
    lib_extra_dirs =
      ~/.platformio/packages/framework-arduinoadafruitnrf52/libraries
    lib_deps =
      symlink://./

  ; BLE-ONLY diagnostic sketch — no CDP/LoRa/GPS/Wire overhead.
  ; Build: EXAMPLE_DIR="Basic-Ducks/Seeed/WioTrackerL1_BLETest" pio run -e local_wio_tracker_l1_bletest
  [env:local_wio_tracker_l1_bletest]
    board = seeed_wio_tracker_l1
    board_build.variants_dir = boards
    board_build.ldscript = nrf52840_s140_v7.ld
    board_level = pr
    extends = nrf52840_base
    build_unflags =
      -std=gnu++11
      -std=gnu++14
      -std=gnu++2a
    build_flags =
      -DSEEED_WIO_TRACKER_L1
      -DLED_BUILTIN=11
      -DNRF52840_XXAA
      -DS140
      -DCFG_DEBUG
      -DSOFTDEVICE_PRESENT
      -DUSE_TINYUSB
      -DENABLE_BLE
      -std=gnu++17
      -Wno-unused-variable
      -DLOOP_STACK_SZ=2048
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/SPI
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Wire
      -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino/src
      -I src/platform/nrf52/softdevice
      -I src/platform/nrf52/softdevice/nrf52
    upload_protocol = adafruit-nrfutil
    upload_flags =
      --package-version
      4
    extra_scripts =
      pre:tools/example_select.py
      pre:tools/add_variant_libpath.py
      post:tools/gen_uf2.py
    lib_ldf_mode = chain+
    lib_ignore =
      ESP Async WebServer
      ESPAsyncTCP
      AsyncTCP
      PubSubClient
    lib_extra_dirs =
      ~/.platformio/packages/framework-arduinoadafruitnrf52/libraries
    lib_deps =
      symlink://./

  ; PRODUCTION — replace <CDP_ZIP_URL> with the published release archive URL.
  [env:prod_wio_tracker_l1]
    platform = nordicnrf52
    framework = arduino
    board = seeed_wio_tracker_l1
    board_build.variants_dir = boards
    board_build.bsp.name = adafruit
    platform_packages =
      framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
    build_unflags =
      -std=gnu++11
      -std=gnu++14
      -std=gnu++2a
    build_flags =
      ${cdp_common.build_flags}
      -DARDUINO_SEEED_WIO_TRACKER_L1
      -std=gnu++17
      -Wno-unused-variable
      -DLOOP_STACK_SZ=8192
    extra_scripts =
      pre:tools/add_variant_libpath.py
    lib_deps =
      ;<CDP_ZIP_URL>
      mikalhart/TinyGPSPlus
      olikraus/U8g2


